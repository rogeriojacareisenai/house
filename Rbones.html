<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação e Leitura de FBX / glTF / GLB</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: rgba(0, 0, 0, 0.85);
            --text-color: #ffffff;
            --border-color: #444;
            --timeline-bg: #2b2b2b;
            --timeline-controls-bg: #333;
            --timeline-ruler-bg: #2a2a2a;
            --timeline-track-bg: #222;
            --frame-cell-bg: #2c2c2c;
            --keyframe-bg: #c0c0c0;
            --keyframe-dot: #000000;
            --input-bg: #222;
            --tween-line-color: #800020;
        }

        body.light-theme {
            --bg-color: #e0e0e0;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --text-color: #111111;
            --border-color: #ccc;
            --timeline-bg: #f0f0f0;
            --timeline-controls-bg: #e0e0e0;
            --timeline-ruler-bg: #e5e5e5;
            --timeline-track-bg: #ffffff;
            --frame-cell-bg: #f5f5f5;
            --keyframe-bg: #a0a0a0;
            --keyframe-dot: #111111;
            --input-bg: #ffffff;
            --tween-line-color: #800020;
        }

        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); user-select: none; transition: background-color 0.3s; }
        
        /* PAINEL LATERAL DE CONTROLES */
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--panel-bg);
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            width: 280px;
            max-height: 60vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }
        button, input, select { cursor: pointer; padding: 4px; }
        .active { background: #4CAF50; color: white; border: none; }
        .btn-group { display: flex; gap: 4px; }
        .btn-group button { flex: 1; font-size: 11px; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 11px; }
        .section-title { font-size: 11px; font-weight: bold; color: #4CAF50; text-transform: uppercase; }
        .slider-row { display: flex; flex-direction: column; gap: 2px; font-size: 11px; }

        /* PAINEL DO OSSO / MODELO */
        #bone-panel {
            background: rgba(125, 125, 125, 0.1);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .coord-group { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
        .coord-field { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .coord-field label { font-size: 9px; opacity: 0.8; }
        .coord-field input { width: 100%; text-align: center; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 3px; font-size: 10px; }

        /* TIMELINE ESTILO FLASH */
        #flash-timeline-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 120px;
            background: var(--timeline-bg);
            border-top: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
        }
        
        .timeline-controls {
            height: 32px;
            background: var(--timeline-controls-bg);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .timeline-controls button {
            background: #444;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            font-size: 11px;
            padding: 3px 8px;
        }

        .timeline-controls button:hover { opacity: 0.8; }

        .timeline-field {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            border-left: 1px solid var(--border-color);
            padding-left: 8px;
            margin-left: 2px;
        }

        .timeline-field input {
            width: 38px;
            text-align: center;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 3px;
        }

        .timeline-scroll-area {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            position: relative;
            background: var(--timeline-track-bg);
            cursor: pointer;
        }

        /* RÉGUA DE FRAMES */
        .timeline-ruler {
            height: 20px;
            background: var(--timeline-ruler-bg);
            display: flex;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .ruler-mark {
            width: 20px;
            min-width: 20px;
            height: 100%;
            border-right: 1px solid var(--border-color);
            font-size: 9px;
            opacity: 0.7;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            pointer-events: none;
        }

        /* TRILHA DE FRAMES */
        .timeline-track {
            height: 35px;
            display: flex;
            background: var(--timeline-track-bg);
            position: relative;
        }

        .frame-cell {
            width: 20px;
            min-width: 20px;
            height: 100%;
            border-right: 1px solid var(--border-color);
            box-sizing: border-box;
            position: relative;
            background: var(--frame-cell-bg);
            pointer-events: none;
        }

        .frame-cell.has-keyframe {
            background: var(--keyframe-bg);
        }

        .frame-cell.has-keyframe::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--keyframe-dot);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .frame-cell.is-interpolated::before {
            content: '';
            position: absolute;
            top: calc(50% - 1px);
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--tween-line-color);
            z-index: 1;
        }

        .frame-cell.active-frame {
            border-left: 2px solid #ff3333;
            border-right: 2px solid #ff3333;
        }

        .frame-cell.active-frame::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -1px;
            width: 100%;
            height: 20px;
            background: rgba(255, 51, 51, 0.4);
            border-top: 2px solid #ff3333;
            z-index: 10;
        }
    </style>
</head>
<body>

<!-- PAINEL LATERAL -->
<div id="ui">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <label style="font-size: 11px;"><strong>1. Carregar Modelo (FBX/glTF/GLB):</strong></label>
        <button id="btn-theme-toggle" style="font-size: 10px; padding: 2px 6px;">🌓 Tema Light/Dark</button>
    </div>
    <input type="file" id="file-input" accept=".fbx, .gltf, .glb" style="font-size: 11px;">
    <span id="model-status" style="font-size: 10px; color: #888;">Nenhum modelo carregado.</span>

    <!-- SEÇÃO DE ANIMAÇÕES EMBUTIDAS -->
    <div id="embedded-anim-container" style="display: none; flex-direction: column; gap: 4px;">
        <label style="font-size: 11px;"><strong>Animações Embutidas:</strong></label>
        <select id="embedded-anim-select" style="font-size: 11px; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color);"></select>
    </div>

    <!-- SEÇÃO DE TEXTURA EXTERNA -->
    <label style="font-size: 11px; margin-top: 4px;"><strong>2. Substituir Textura Externa (Opcional):</strong></label>
    <input type="file" id="texture-input" accept="image/png, image/jpeg" style="font-size: 11px;">
    <span id="texture-status" style="font-size: 10px; color: #888;">Textura do modelo preservada.</span>

    <hr style="width: 100%; border: 0.5px solid var(--border-color); margin: 0;">

    <!-- SEÇÃO DE LUZ AMBIENTE / PRESETS DE ILUMINAÇÃO -->
    <div style="display: flex; flex-direction: column; gap: 4px;">
        <label style="font-size: 11px;"><strong>Iluminação Ambiente:</strong></label>
        <select id="ambient-light-select" style="font-size: 11px; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; padding: 4px;">
            <option value="neutral">💡 Neutra / Padrão</option>
            <option value="daylight">☀️ Luz Diurna / Dia Ensolarado</option>
            <option value="sunset">🌅 Pôr do Sol / Golden Hour</option>
            <option value="night">🌙 Luz Noturna / Luar</option>
            <option value="studio">🎬 Estúdio / Softbox</option>
            <option value="cyberpunk">🛈 Neon / Cyberpunk</option>
        </select>
    </div>

    <hr style="width: 100%; border: 0.5px solid var(--border-color); margin: 0;">

    <label style="font-size: 11px;"><strong>Sessão no Navegador:</strong></label>
    <div class="btn-group">
        <button id="btn-save-session" style="background: #2e7d32; color: #fff;">💾 Salvar Projeto</button>
        <button id="btn-load-session" style="background: #ef6c00; color: #fff;">📂 Carregar Projeto</button>
    </div>

    <hr style="width: 100%; border: 0.5px solid var(--border-color); margin: 0;">

    <div class="checkbox-row">
        <input type="checkbox" id="chk-skeleton" checked>
        <label for="chk-skeleton">Exibir Esqueleto</label>
    </div>

    <div class="checkbox-row">
        <input type="checkbox" id="chk-pickers" checked>
        <label for="chk-pickers">Exibir Juntas Interativas</label>
    </div>

    <div class="slider-row">
        <label>Tamanho das Juntas:</label>
        <input type="range" id="picker-radius-slider" min="0.5" max="6.0" step="0.2" value="1.8">
    </div>

    <div class="slider-row">
        <label>Opacidade da Malha:</label>
        <input type="range" id="opacity-slider" min="0.0" max="1.0" step="0.05" value="1.0">
    </div>

    <hr style="width: 100%; border: 0.5px solid var(--border-color); margin: 0;">

    <label style="font-size: 11px;"><strong>Modo de Gizmo:</strong></label>
    <div class="btn-group">
        <button id="btn-mode-translate" class="active">Mover</button>
        <button id="btn-mode-rotate">Rotacionar</button>
        <button id="btn-mode-scale">Escalonar</button>
    </div>

    <button id="btn-select-root" style="background: #1976d2; color: #fff; font-size: 11px; margin-top: 4px;">🦴 Selecionar Raiz (Todo o Esqueleto)</button>

    <div id="bone-panel" style="display: none;">
        <span class="section-title" id="selected-bone-name">Osso Selecionado</span>
        
        <div style="font-size: 10px; font-weight: bold;">Posição:</div>
        <div class="coord-group">
            <div class="coord-field"><label>X</label><input type="number" id="pos-x" step="0.1"></div>
            <div class="coord-field"><label>Y</label><input type="number" id="pos-y" step="0.1"></div>
            <div class="coord-field"><label>Z</label><input type="number" id="pos-z" step="0.1"></div>
        </div>

        <div style="font-size: 10px; font-weight: bold;">Rotação (°):</div>
        <div class="coord-group">
            <div class="coord-field"><label>X</label><input type="number" id="rot-x" step="1"></div>
            <div class="coord-field"><label>Y</label><input type="number" id="rot-y" step="1"></div>
            <div class="coord-field"><label>Z</label><input type="number" id="rot-z" step="1"></div>
        </div>
    </div>
</div>

<!-- TIMELINE FLASH -->
<div id="flash-timeline-container">
    <div class="timeline-controls">
        <button id="btn-play">► Play</button>
        <button id="btn-add-keyframe" style="background: #2e7d32;">F6 - Keyframe</button>
        <button id="btn-clear-keyframe" style="background: #c62828;">F7 - Limpar</button>
        <button id="btn-undo" title="Desfazer (Ctrl+Z)">↩ Undo</button>
        <button id="btn-center-scene" style="background: #6a1b9a;" title="Centralizar Visualização da Cena">🎯 Centralizar Cena</button>
        
        <div class="timeline-field">
            <label for="fps-input">FPS:</label>
            <input type="number" id="fps-input" value="12" min="1" max="60">
        </div>

        <div class="timeline-field">
            <label for="total-frames-input">Fim:</label>
            <input type="number" id="total-frames-input" value="60" min="2" max="500">
        </div>

        <div style="display: flex; gap: 4px; border-left: 1px solid var(--border-color); padding-left: 8px;">
            <button id="btn-save-anim" style="background: #0277bd;">💾 Exportar JSON</button>
            <button id="btn-load-anim" style="background: #ef6c00;">📂 Importar JSON</button>
            <input type="file" id="anim-file-input" accept=".json" style="display: none;">
        </div>

        <span style="font-size: 11px; margin-left: auto;">
            Frame: <strong id="current-frame-text" style="color: #4CAF50;">1</strong> / <span id="total-frames-text">60</span>
        </span>
    </div>

    <div class="timeline-scroll-area" id="timeline-scroll">
        <div class="timeline-ruler" id="timeline-ruler"></div>
        <div class="timeline-track" id="timeline-track"></div>
    </div>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

let gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
scene.add(gridHelper);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / (window.innerHeight - 120), 0.1, 1000);
camera.position.set(0, 100, 250);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight - 120);
renderer.outputColorSpace = THREE.SRGBColorSpace; // Garantir mapeamento correto de cores das texturas GLB
document.body.appendChild(renderer.domElement);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 90, 0);

// GERENCIAMENTO DE ILUMINAÇÃO DINÂMICA COM PRESETS
const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(100, 200, 150);
scene.add(dirLight);

// Grupo para armazenar luzes secundárias criadas dinamicamente pelos presets (Softbox, Cyberpunk, etc.)
const extraLightsGroup = new THREE.Group();
scene.add(extraLightsGroup);

function applyLightingPreset(preset) {
    // Limpar luzes extras de presets anteriores
    while (extraLightsGroup.children.length > 0) {
        const obj = extraLightsGroup.children[0];
        extraLightsGroup.remove(obj);
        if (obj.dispose) obj.dispose();
    }

    switch (preset) {
        case 'daylight':
            // Céu azulado suave com sol amarelo e intenso
            ambientLight.color.setHex(0xcae5ff);
            ambientLight.intensity = 0.9;
            dirLight.color.setHex(0xfffaed);
            dirLight.intensity = 2.0;
            dirLight.position.set(120, 250, 100);
            break;

        case 'sunset':
            // Pôr do sol: tons alaranjados e avermelhados com luz solar rasante
            ambientLight.color.setHex(0xffaa77);
            ambientLight.intensity = 0.7;
            dirLight.color.setHex(0xff5500);
            dirLight.intensity = 2.5;
            dirLight.position.set(-200, 40, -100);
            break;

        case 'night':
            // Luar noturno: iluminação tênue em tom azul frio
            ambientLight.color.setHex(0x112244);
            ambientLight.intensity = 0.4;
            dirLight.color.setHex(0x6688ff);
            dirLight.intensity = 0.8;
            dirLight.position.set(-80, 180, -80);
            break;

        case 'studio':
            // Estúdio / Softbox: Luz de preenchimento de três pontos (Key, Fill, Rim)
            ambientLight.color.setHex(0xffffff);
            ambientLight.intensity = 0.6;
            
            // Key light
            dirLight.color.setHex(0xffffff);
            dirLight.intensity = 1.2;
            dirLight.position.set(150, 150, 150);

            // Fill light
            const fillLight = new THREE.DirectionalLight(0xddeeff, 0.6);
            fillLight.position.set(-150, 100, 150);
            extraLightsGroup.add(fillLight);

            // Back / Rim light
            const rimLight = new THREE.DirectionalLight(0xffffff, 1.0);
            rimLight.position.set(0, 150, -200);
            extraLightsGroup.add(rimLight);
            break;

        case 'cyberpunk':
            // Neon / Cyberpunk: contraste vibrante entre Rosa Magenta e Ciano
            ambientLight.color.setHex(0x220033);
            ambientLight.intensity = 0.5;

            // Luz direcional Ciano
            dirLight.color.setHex(0x00ffff);
            dirLight.intensity = 1.8;
            dirLight.position.set(-150, 100, 100);

            // Luz pontual Magenta
            const magentaPoint = new THREE.PointLight(0xff007f, 3.0, 500);
            magentaPoint.position.set(150, 80, -50);
            extraLightsGroup.add(magentaPoint);

            // Luz de preenchimento Azul Elétrico
            const bluePoint = new THREE.PointLight(0x0055ff, 2.0, 400);
            bluePoint.position.set(0, -50, 150);
            extraLightsGroup.add(bluePoint);
            break;

        case 'neutral':
        default:
            // Preset Padrão: Luz branca equilibrada
            ambientLight.color.setHex(0xffffff);
            ambientLight.intensity = 1.2;
            dirLight.color.setHex(0xffffff);
            dirLight.intensity = 1.5;
            dirLight.position.set(100, 200, 150);
            break;
    }
}

// Event listener para troca de preset de luz ambiente
document.getElementById('ambient-light-select').addEventListener('change', (e) => {
    applyLightingPreset(e.target.value);
    saveEnvironmentSettings();
});

const SETTINGS_KEY = 'model_animator_settings';
const SESSION_PROJECT_KEY = 'model_animator_project_session';

function saveEnvironmentSettings() {
    const settings = {
        theme: document.body.classList.contains('light-theme') ? 'light' : 'dark',
        showSkeleton: document.getElementById('chk-skeleton').checked,
        showPickers: document.getElementById('chk-pickers').checked,
        pickerRadius: document.getElementById('picker-radius-slider').value,
        meshOpacity: document.getElementById('opacity-slider').value,
        ambientPreset: document.getElementById('ambient-light-select').value,
        cameraPos: [camera.position.x, camera.position.y, camera.position.z],
        cameraTarget: [orbit.target.x, orbit.target.y, orbit.target.z]
    };
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function loadEnvironmentSettings() {
    const saved = localStorage.getItem(SETTINGS_KEY);
    if (!saved) return;

    try {
        const settings = JSON.parse(saved);
        if (settings.theme === 'light') {
            document.body.classList.add('light-theme');
            scene.background.setHex(0xe0e0e0);
            scene.remove(gridHelper);
            gridHelper = new THREE.GridHelper(20, 20, 0x888888, 0xcccccc);
            scene.add(gridHelper);
        }
        if (settings.showSkeleton !== undefined) document.getElementById('chk-skeleton').checked = settings.showSkeleton;
        if (settings.showPickers !== undefined) document.getElementById('chk-pickers').checked = settings.showPickers;
        if (settings.pickerRadius !== undefined) document.getElementById('picker-radius-slider').value = settings.pickerRadius;
        if (settings.meshOpacity !== undefined) document.getElementById('opacity-slider').value = settings.meshOpacity;

        if (settings.ambientPreset !== undefined) {
            document.getElementById('ambient-light-select').value = settings.ambientPreset;
            applyLightingPreset(settings.ambientPreset);
        }

        if (settings.cameraPos) camera.position.set(...settings.cameraPos);
        if (settings.cameraTarget) {
            orbit.target.set(...settings.cameraTarget);
            orbit.update();
        }
    } catch (e) {
        console.warn('Erro ao carregar configurações:', e);
    }
}

orbit.addEventListener('end', saveEnvironmentSettings);
loadEnvironmentSettings();

const undoStack = [];
const redoStack = [];
const MAX_HISTORY = 30;

function pushState() {
    const snapshot = new Map();
    keyframesMap.forEach((pose, frameIdx) => {
        const poseCopy = pose.map(p => ({
            position: p.position.clone(),
            quaternion: p.quaternion.clone(),
            scale: p.scale.clone()
        }));
        snapshot.set(frameIdx, poseCopy);
    });
    undoStack.push(snapshot);
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack.length = 0;
}

function undo() {
    if (undoStack.length === 0) return;
    const currentSnapshot = new Map();
    keyframesMap.forEach((pose, frameIdx) => {
        const poseCopy = pose.map(p => ({
            position: p.position.clone(),
            quaternion: p.quaternion.clone(),
            scale: p.scale.clone()
        }));
        currentSnapshot.set(frameIdx, poseCopy);
    });
    redoStack.push(currentSnapshot);

    const previousState = undoStack.pop();
    restoreState(previousState);
}

function redo() {
    if (redoStack.length === 0) return;
    const currentSnapshot = new Map();
    keyframesMap.forEach((pose, frameIdx) => {
        const poseCopy = pose.map(p => ({
            position: p.position.clone(),
            quaternion: p.quaternion.clone(),
            scale: p.scale.clone()
        }));
        currentSnapshot.set(frameIdx, poseCopy);
    });
    undoStack.push(currentSnapshot);

    const nextState = redoStack.pop();
    restoreState(nextState);
}

function restoreState(snapshotMap) {
    keyframesMap.clear();
    snapshotMap.forEach((pose, frameIdx) => {
        const poseCopy = pose.map(p => ({
            position: p.position.clone(),
            quaternion: p.quaternion.clone(),
            scale: p.scale.clone()
        }));
        keyframesMap.set(frameIdx, poseCopy);
    });
    updateTimelineGrid();
    applyPoseForFrame(currentFrame);
}

const transformControls = new TransformControls(camera, renderer.domElement);
transformControls.setMode('translate');
transformControls.addEventListener('dragging-changed', (event) => {
    orbit.enabled = !event.value;
    if (event.value) pushState();
});

transformControls.addEventListener('change', () => {
    updateUIInputs();
    if (transformControls.dragging) {
        saveKeyframe(currentFrame, false, false);
    }
});
scene.add(transformControls);

let characterGroup = null;
let skeletonHelper = null;
let bonePickers = [];
let selectedBone = null;
let boneMap = new Map();
let allBones = [];
let loadedTexture = null;

let mixer = null;
let animations = [];
let activeAction = null;
const clock = new THREE.Clock();

let loadedFileName = "";
let totalFrames = 60;
let currentFrame = 0;
let keyframesMap = new Map();
let isPlaying = false;
let playInterval = null;
let targetFPS = 12;

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// CARREGAR TEXTURA EXTERNA (SOBREPÕE A TEXTURA DO GLB SE FOR SELECIONADA)
document.getElementById('texture-input').addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load(e.target.result, (texture) => {
            texture.colorSpace = THREE.SRGBColorSpace;
            loadedTexture = texture;
            applyTextureToModel();
            document.getElementById('texture-status').innerText = `Textura Manual: ${file.name}`;
        });
    };
});

function applyTextureToModel() {
    if (!characterGroup || !loadedTexture) return;

    characterGroup.traverse((child) => {
        if (child.isMesh) {
            if (Array.isArray(child.material)) {
                child.material.forEach(mat => {
                    mat.map = loadedTexture;
                    mat.needsUpdate = true;
                });
            } else if (child.material) {
                child.material.map = loadedTexture;
                child.material.needsUpdate = true;
            }
        }
    });
}

// CARREGAR ARQUIVO (FBX / GLTF / GLB)
document.getElementById('file-input').addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) return;

    loadedFileName = file.name;
    const ext = loadedFileName.split('.').pop().toLowerCase();
    document.getElementById('model-status').innerText = `Modelo: ${loadedFileName}`;

    const reader = new FileReader();
    reader.readAsArrayBuffer(file);
    reader.onload = (e) => {
        if (ext === 'fbx') {
            loadFBXFromArrayBuffer(e.target.result);
        } else if (ext === 'gltf' || ext === 'glb') {
            loadGLTFFromArrayBuffer(e.target.result);
        }
    };
});

function processLoadedModel(model, modelAnimations = []) {
    clearCurrentModel();

    characterGroup = model;
    scene.add(characterGroup);
    characterGroup.scale.setScalar(1);

    allBones.push(characterGroup);

    skeletonHelper = new THREE.SkeletonHelper(characterGroup);
    skeletonHelper.material.linewidth = 2;
    scene.add(skeletonHelper);

    const radius = parseFloat(document.getElementById('picker-radius-slider').value);

    characterGroup.traverse((child) => {
        if (child.isMesh) {
            child.material.side = THREE.DoubleSide;
            child.material.transparent = true;
            child.material.opacity = parseFloat(document.getElementById('opacity-slider').value);

            // Garante que texturas internas embutidas do GLB fiquem no espaço de cor correto
            if (child.material.map) {
                child.material.map.colorSpace = THREE.SRGBColorSpace;
                child.material.needsUpdate = true;
            }
        }

        if (child.isBone || child.isObject3D) {
            if (child.isBone) child.matrixAutoUpdate = true;
            if (child.isBone && !allBones.includes(child)) {
                allBones.push(child);

                const pickerGeo = new THREE.SphereGeometry(radius, 16, 16);
                const pickerMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, depthTest: false, transparent: true, opacity: 0.8 });
                const picker = new THREE.Mesh(pickerGeo, pickerMat);
                picker.renderOrder = 999;
                
                scene.add(picker);
                bonePickers.push(picker);
                boneMap.set(picker, child);
            }
        }
    });

    if (loadedTexture) applyTextureToModel();

    // GERENCIAMENTO DE ANIMAÇÕES EMBUTIDAS (GLTF / GLB / FBX)
    animations = modelAnimations;
    const animSelect = document.getElementById('embedded-anim-select');
    const animContainer = document.getElementById('embedded-anim-container');
    animSelect.innerHTML = '<option value="">Nenhuma (Usar Linha do Tempo)</option>';

    if (animations.length > 0) {
        mixer = new THREE.AnimationMixer(characterGroup);
        animations.forEach((clip, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.innerText = clip.name || `Animação ${index + 1}`;
            animSelect.appendChild(opt);
        });
        animContainer.style.display = 'flex';
    } else {
        animContainer.style.display = 'none';
    }

    saveKeyframe(0, true, false);
    buildFlashTimelineUI();
    selectFrame(0);
    selectBone(characterGroup);
    updateVisibility();
}

function loadFBXFromArrayBuffer(arrayBuffer) {
    const loader = new FBXLoader();
    const fbx = loader.parse(arrayBuffer, '');
    processLoadedModel(fbx, fbx.animations || []);
}

function loadGLTFFromArrayBuffer(arrayBuffer) {
    const loader = new GLTFLoader();
    loader.parse(arrayBuffer, '', (gltf) => {
        processLoadedModel(gltf.scene, gltf.animations || []);
    });
}

document.getElementById('embedded-anim-select').addEventListener('change', (e) => {
    const index = e.target.value;
    if (activeAction) activeAction.stop();

    if (index !== "" && mixer && animations[index]) {
        activeAction = mixer.clipAction(animations[index]);
        activeAction.play();
    } else {
        activeAction = null;
    }
});

function clearCurrentModel() {
    stopAnimation();
    if (characterGroup) scene.remove(characterGroup);
    if (skeletonHelper) scene.remove(skeletonHelper);
    bonePickers.forEach(p => scene.remove(p));
    bonePickers = [];
    boneMap.clear();
    allBones = [];
    keyframesMap.clear();
    undoStack.length = 0;
    redoStack.length = 0;
    transformControls.detach();
    selectedBone = null;
    mixer = null;
    activeAction = null;
    animations = [];
    document.getElementById('bone-panel').style.display = 'none';
}

function updateHelpers() {
    bonePickers.forEach(picker => {
        const bone = boneMap.get(picker);
        if (bone) {
            bone.getWorldPosition(picker.position);
            picker.material.color.setHex(bone === selectedBone ? 0x00ff00 : 0xffcc00);
        }
    });
}

function selectBone(bone) {
    selectedBone = bone;
    transformControls.attach(bone);
    document.getElementById('bone-panel').style.display = 'flex';
    document.getElementById('selected-bone-name').innerText = (bone === characterGroup) ? 'Raiz (Todo o Esqueleto)' : (bone.name || 'Osso Selecionado');
    updateUIInputs();
}

document.getElementById('btn-select-root').addEventListener('click', () => {
    if (characterGroup) selectBone(characterGroup);
});

function updateUIInputs() {
    if (!selectedBone) return;
    document.getElementById('pos-x').value = selectedBone.position.x.toFixed(2);
    document.getElementById('pos-y').value = selectedBone.position.y.toFixed(2);
    document.getElementById('pos-z').value = selectedBone.position.z.toFixed(2);
    document.getElementById('rot-x').value = THREE.MathUtils.radToDeg(selectedBone.rotation.x).toFixed(0);
    document.getElementById('rot-y').value = THREE.MathUtils.radToDeg(selectedBone.rotation.y).toFixed(0);
    document.getElementById('rot-z').value = THREE.MathUtils.radToDeg(selectedBone.rotation.z).toFixed(0);
}

['pos-x', 'pos-y', 'pos-z'].forEach((id, index) => {
    const inputEl = document.getElementById(id);
    inputEl.addEventListener('focus', () => pushState());
    inputEl.addEventListener('input', (e) => {
        if (!selectedBone) return;
        selectedBone.position[['x', 'y', 'z'][index]] = parseFloat(e.target.value) || 0;
        saveKeyframe(currentFrame, false, false);
    });
});

['rot-x', 'rot-y', 'rot-z'].forEach((id, index) => {
    const inputEl = document.getElementById(id);
    inputEl.addEventListener('focus', () => pushState());
    inputEl.addEventListener('input', (e) => {
        if (!selectedBone) return;
        selectedBone.rotation[['x', 'y', 'z'][index]] = THREE.MathUtils.degToRad(parseFloat(e.target.value) || 0);
        saveKeyframe(currentFrame, false, false);
    });
});

function buildFlashTimelineUI() {
    const rulerContainer = document.getElementById('timeline-ruler');
    const trackContainer = document.getElementById('timeline-track');
    
    rulerContainer.innerHTML = '';
    trackContainer.innerHTML = '';

    for (let i = 0; i < totalFrames; i++) {
        const mark = document.createElement('div');
        mark.className = 'ruler-mark';
        if ((i + 1) % 5 === 0 || i === 0) mark.innerText = i + 1;
        rulerContainer.appendChild(mark);

        const cell = document.createElement('div');
        cell.className = 'frame-cell';
        cell.dataset.frame = i;
        trackContainer.appendChild(cell);
    }
    document.getElementById('total-frames-text').innerText = totalFrames;
    updateTimelineGrid();
}

function saveKeyframe(frameIdx, updateUI = true, recordHistory = true) {
    if (allBones.length === 0) return;
    if (recordHistory) pushState();

    const poseSnapshot = allBones.map(bone => ({
        position: bone.position.clone(),
        quaternion: bone.quaternion.clone(),
        scale: bone.scale.clone()
    }));
    keyframesMap.set(frameIdx, poseSnapshot);
    if (updateUI) updateTimelineGrid();
}

function clearKeyframe(frameIdx) {
    pushState();
    keyframesMap.delete(frameIdx);
    updateTimelineGrid();
    applyPoseForFrame(currentFrame);
}

function selectFrame(frameIdx) {
    currentFrame = Math.max(0, Math.min(totalFrames - 1, frameIdx));
    document.getElementById('current-frame-text').innerText = currentFrame + 1;
    if (!activeAction) {
        applyPoseForFrame(currentFrame);
    }
    updateTimelineGrid();
}

function applyPoseForFrame(frameIdx) {
    if (allBones.length === 0 || keyframesMap.size === 0) return;

    if (keyframesMap.has(frameIdx)) {
        const pose = keyframesMap.get(frameIdx);
        allBones.forEach((bone, idx) => {
            bone.position.copy(pose[idx].position);
            bone.quaternion.copy(pose[idx].quaternion);
            bone.scale.copy(pose[idx].scale);
        });
        updateUIInputs();
        return;
    }

    const sortedFrames = Array.from(keyframesMap.keys()).sort((a, b) => a - b);
    let prevFrame = -1;
    let nextFrame = -1;

    for (let f of sortedFrames) {
        if (f < frameIdx) prevFrame = f;
        if (f > frameIdx && nextFrame === -1) nextFrame = f;
    }

    if (prevFrame !== -1 && nextFrame !== -1) {
        const factor = (frameIdx - prevFrame) / (nextFrame - prevFrame);
        const prevPose = keyframesMap.get(prevFrame);
        const nextPose = keyframesMap.get(nextFrame);

        allBones.forEach((bone, idx) => {
            bone.position.lerpVectors(prevPose[idx].position, nextPose[idx].position, factor);
            bone.quaternion.slerpQuaternions(prevPose[idx].quaternion, nextPose[idx].quaternion, factor);
            bone.scale.lerpVectors(prevPose[idx].scale, nextPose[idx].scale, factor);
        });
    } else if (prevFrame !== -1) {
        const prevPose = keyframesMap.get(prevFrame);
        allBones.forEach((bone, idx) => {
            bone.position.copy(prevPose[idx].position);
            bone.quaternion.copy(prevPose[idx].quaternion);
            bone.scale.copy(prevPose[idx].scale);
        });
    }
    updateUIInputs();
}

function updateTimelineGrid() {
    const cells = document.querySelectorAll('.frame-cell');
    const sortedFrames = Array.from(keyframesMap.keys()).sort((a, b) => a - b);

    cells.forEach((cell, idx) => {
        cell.classList.toggle('active-frame', idx === currentFrame);
        cell.classList.toggle('has-keyframe', keyframesMap.has(idx));

        let isTween = false;
        if (!keyframesMap.has(idx) && sortedFrames.length >= 2) {
            const firstKey = sortedFrames[0];
            const lastKey = sortedFrames[sortedFrames.length - 1];
            if (idx > firstKey && idx < lastKey) isTween = true;
        }
        cell.classList.toggle('is-interpolated', isTween);
    });
}

function centerScene() {
    camera.position.set(0, 100, 250);
    orbit.target.set(0, 90, 0);
    orbit.update();
    saveEnvironmentSettings();
}

document.getElementById('btn-center-scene').addEventListener('click', centerScene);

function serializeProjectData() {
    const keyframesArr = [];
    keyframesMap.forEach((pose, frameIdx) => {
        keyframesArr.push({
            frame: frameIdx,
            pose: pose.map(p => ({
                pos: [p.position.x, p.position.y, p.position.z],
                rot: [p.quaternion.x, p.quaternion.y, p.quaternion.z, p.quaternion.w],
                scl: [p.scale.x, p.scale.y, p.scale.z]
            }))
        });
    });

    return {
        loadedFileName: loadedFileName || 'modelo.glb',
        fps: targetFPS,
        totalFrames: totalFrames,
        keyframes: keyframesArr
    };
}

document.getElementById('btn-save-session').addEventListener('click', () => {
    localStorage.setItem(SESSION_PROJECT_KEY, JSON.stringify(serializeProjectData()));
    saveEnvironmentSettings();
    alert('Projeto salvo com sucesso!');
});

document.getElementById('btn-load-session').addEventListener('click', () => {
    const savedProject = localStorage.getItem(SESSION_PROJECT_KEY);
    if (!savedProject) return alert('Nenhum projeto encontrado.');
    try {
        applySerializedProject(JSON.parse(savedProject));
        alert('Projeto carregado!');
    } catch (err) {
        alert('Erro ao carregar: ' + err.message);
    }
});

function applySerializedProject(data) {
    if (data.loadedFileName) loadedFileName = data.loadedFileName;
    if (data.fps) { targetFPS = data.fps; document.getElementById('fps-input').value = targetFPS; }
    if (data.totalFrames) { totalFrames = data.totalFrames; document.getElementById('total-frames-input').value = totalFrames; }

    if (allBones.length > 0) {
        pushState();
        keyframesMap.clear();
        data.keyframes.forEach(kf => {
            const poseSnapshot = kf.pose.map(p => ({
                position: new THREE.Vector3(...p.pos),
                quaternion: new THREE.Quaternion(...p.rot),
                scale: new THREE.Vector3(...p.scl)
            }));
            keyframesMap.set(kf.frame, poseSnapshot);
        });
        buildFlashTimelineUI();
        selectFrame(0);
    }
}

const scrollArea = document.getElementById('timeline-scroll');
let isScrubbing = false;

function handleTimelineScrub(e) {
    const rect = scrollArea.getBoundingClientRect();
    const offsetX = e.clientX - rect.left + scrollArea.scrollLeft;
    const frameIndex = Math.floor(offsetX / 20);
    if (frameIndex >= 0 && frameIndex < totalFrames && frameIndex !== currentFrame) {
        selectFrame(frameIndex);
    }
}

scrollArea.addEventListener('mousedown', (e) => { isScrubbing = true; handleTimelineScrub(e); });
window.addEventListener('mousemove', (e) => { if (isScrubbing) handleTimelineScrub(e); });
window.addEventListener('mouseup', () => { isScrubbing = false; });

document.getElementById('total-frames-input').addEventListener('change', (e) => {
    let val = Math.max(2, Math.min(500, parseInt(e.target.value) || 60));
    e.target.value = val;
    totalFrames = val;
    buildFlashTimelineUI();
    if (currentFrame >= totalFrames) selectFrame(totalFrames - 1);
});

document.getElementById('fps-input').addEventListener('change', (e) => {
    let val = Math.max(1, Math.min(60, parseInt(e.target.value) || 12));
    e.target.value = val;
    targetFPS = val;
    if (isPlaying) { stopAnimation(); startAnimation(); }
});

function togglePlay() {
    if (isPlaying) stopAnimation();
    else startAnimation();
}

function startAnimation() {
    isPlaying = true;
    document.getElementById('btn-play').innerText = '❚❚ Pause';
    playInterval = setInterval(() => {
        currentFrame = (currentFrame + 1) % totalFrames;
        selectFrame(currentFrame);
    }, 1000 / targetFPS);
}

function stopAnimation() {
    isPlaying = false;
    document.getElementById('btn-play').innerText = '► Play';
    if (playInterval) clearInterval(playInterval);
}

document.getElementById('btn-play').addEventListener('click', togglePlay);
document.getElementById('btn-add-keyframe').addEventListener('click', () => saveKeyframe(currentFrame, true));
document.getElementById('btn-clear-keyframe').addEventListener('click', () => clearKeyframe(currentFrame));
document.getElementById('btn-undo').addEventListener('click', undo);

document.getElementById('btn-save-anim').addEventListener('click', () => {
    if (keyframesMap.size === 0) return alert('Sem keyframes.');
    const exportData = serializeProjectData();
    exportData.bonesOrder = allBones.map(b => b.name || 'Root');
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (loadedFileName ? loadedFileName.replace(/\.[^/.]+$/, '') : 'animacao') + '_export.json';
    a.click();
    URL.revokeObjectURL(url);
});

document.getElementById('btn-load-anim').addEventListener('click', () => document.getElementById('anim-file-input').click());
document.getElementById('anim-file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        try {
            applySerializedProject(JSON.parse(event.target.result));
            alert('Animação importada!');
        } catch (err) {
            alert('Erro: ' + err.message);
        }
    };
    reader.readAsText(file);
});

window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) redo(); else undo();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        e.preventDefault(); redo();
    } else if (e.key === 'F6') { e.preventDefault(); saveKeyframe(currentFrame, true); }
    else if (e.key === 'F7') { e.preventDefault(); clearKeyframe(currentFrame); }
    else if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); togglePlay(); }
});

document.getElementById('btn-theme-toggle').addEventListener('click', () => {
    document.body.classList.toggle('light-theme');
    const isLight = document.body.classList.contains('light-theme');
    scene.background.setHex(isLight ? 0xe0e0e0 : 0x1a1a1a);
    scene.remove(gridHelper);
    gridHelper = new THREE.GridHelper(20, 20, isLight ? 0x888888 : 0x444444, isLight ? 0xcccccc : 0x222222);
    scene.add(gridHelper);
    saveEnvironmentSettings();
});

document.getElementById('picker-radius-slider').addEventListener('input', (e) => {
    const newGeo = new THREE.SphereGeometry(parseFloat(e.target.value), 16, 16);
    bonePickers.forEach(p => { p.geometry.dispose(); p.geometry = newGeo; });
    saveEnvironmentSettings();
});

const setMode = (mode, btnId) => {
    transformControls.setMode(mode);
    ['btn-mode-translate', 'btn-mode-rotate', 'btn-mode-scale'].forEach(id => {
        document.getElementById(id).classList.toggle('active', id === btnId);
    });
};

document.getElementById('btn-mode-translate').addEventListener('click', () => setMode('translate', 'btn-mode-translate'));
document.getElementById('btn-mode-rotate').addEventListener('click', () => setMode('rotate', 'btn-mode-rotate'));
document.getElementById('btn-mode-scale').addEventListener('click', () => setMode('scale', 'btn-mode-scale'));

function updateVisibility() {
    if (skeletonHelper) skeletonHelper.visible = document.getElementById('chk-skeleton').checked;
    bonePickers.forEach(p => p.visible = document.getElementById('chk-pickers').checked);
}

document.getElementById('chk-skeleton').addEventListener('change', () => { updateVisibility(); saveEnvironmentSettings(); });
document.getElementById('chk-pickers').addEventListener('change', () => { updateVisibility(); saveEnvironmentSettings(); });

document.getElementById('opacity-slider').addEventListener('input', (e) => {
    const opacity = parseFloat(e.target.value);
    if (characterGroup) characterGroup.traverse((child) => { if (child.isMesh) child.material.opacity = opacity; });
    saveEnvironmentSettings();
});

window.addEventListener('pointerdown', (event) => {
    if (event.clientY > window.innerHeight - 120 || ['INPUT', 'BUTTON', 'LABEL', 'SELECT'].includes(event.target.tagName)) return;
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / (window.innerHeight - 120)) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(bonePickers.filter(p => p.visible));
    if (intersects.length > 0) {
        const targetBone = boneMap.get(intersects[0].object);
        if (targetBone) selectBone(targetBone);
    }
});

function animate() {
    requestAnimationFrame(animate);
    
    const delta = clock.getDelta();
    if (mixer && activeAction) {
        mixer.update(delta);
    }

    updateHelpers();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / (window.innerHeight - 120);
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight - 120);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edição de Posição de Ossos - Mixamo FBX</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #111; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
            width: 300px;
            max-height: 90vh;
            overflow-y: auto;
        }
        button, input { cursor: pointer; padding: 5px; }
        .instructions { font-size: 11px; color: #ccc; line-height: 1.3; }
        .active { background: #4CAF50; color: white; border: none; }
        .btn-group { display: flex; gap: 4px; }
        .btn-group button { flex: 1; font-size: 11px; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .section-title { font-size: 12px; font-weight: bold; color: #4CAF50; text-transform: uppercase; }
        
        /* Estilos do Painel do Osso Selecionado */
        #bone-panel {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid #444;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .coord-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .coord-field {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .coord-field label {
            font-size: 10px;
            color: #aaa;
            margin-bottom: 2px;
        }
        .coord-field input {
            width: 100%;
            text-align: center;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .coord-field input:focus {
            border-color: #4CAF50;
            outline: none;
        }
    </style>
</head>
<body>

<div id="ui">
    <label><strong>1. Carregar FBX do Mixamo:</strong></label>
    <input type="file" id="file-input" accept=".fbx">
    
    <hr style="width: 100%; border: 0.5px solid #555; margin: 0;">

    <div class="checkbox-row">
        <input type="checkbox" id="chk-skeleton" checked>
        <label for="chk-skeleton">Exibir Linhas do Esqueleto</label>
    </div>

    <div class="checkbox-row">
        <input type="checkbox" id="chk-pickers" checked>
        <label for="chk-pickers">Exibir Pontos das Juntas</label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; font-size: 12px;">
        <label>Opacidade do Personagem:</label>
        <input type="range" id="opacity-slider" min="0.0" max="1.0" step="0.05" value="0.5">
    </div>

    <hr style="width: 100%; border: 0.5px solid #555; margin: 0;">

    <label><strong>2. Modo de Transformação Visual:</strong></label>
    <div class="btn-group">
        <button id="btn-mode-translate" class="active">Mover</button>
        <button id="btn-mode-rotate">Rotacionar</button>
        <button id="btn-mode-scale">Escalonar</button>
    </div>

    <!-- PAINEL DE CONTROLE DE POSIÇÃO DO OSSO SELECIONADO -->
    <div id="bone-panel" style="display: none;">
        <span class="section-title" id="selected-bone-name">Osso Selecionado</span>
        
        <div style="font-size: 11px; color: #ddd; font-weight: bold; margin-top: 2px;">Editar Posição Local:</div>
        <div class="coord-group">
            <div class="coord-field">
                <label for="pos-x">X</label>
                <input type="number" id="pos-x" step="0.1">
            </div>
            <div class="coord-field">
                <label for="pos-y">Y</label>
                <input type="number" id="pos-y" step="0.1">
            </div>
            <div class="coord-field">
                <label for="pos-z">Z</label>
                <input type="number" id="pos-z" step="0.1">
            </div>
        </div>

        <div style="font-size: 11px; color: #ddd; font-weight: bold; margin-top: 4px;">Editar Rotação (°):</div>
        <div class="coord-group">
            <div class="coord-field">
                <label for="rot-x">X</label>
                <input type="number" id="rot-x" step="1">
            </div>
            <div class="coord-field">
                <label for="rot-y">Y</label>
                <input type="number" id="rot-y" step="1">
            </div>
            <div class="coord-field">
                <label for="rot-z">Z</label>
                <input type="number" id="rot-z" step="1">
            </div>
        </div>

        <button id="btn-reset-selected" style="margin-top: 6px; font-size: 11px;">Resetar Posição Deste Osso</button>
    </div>

    <div class="instructions">
        • Clique na junta desejada na tela para selecioná-la.<br>
        • Digite os valores de <strong>X, Y e Z</strong> nos campos para deslocar o osso com precisão ou arraste o manipulador 3D.
    </div>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

// --- CENA ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
gridHelper.position.y = 0;
scene.add(gridHelper);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 100, 250);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 90, 0);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight1.position.set(100, 200, 150);
scene.add(dirLight1);

// --- CONTROLES DE TRANSFORMAÇÃO (GIZMO) ---
const transformControls = new TransformControls(camera, renderer.domElement);
transformControls.setMode('translate'); // Inicia em modo Mover
transformControls.addEventListener('dragging-changed', (event) => {
    orbit.enabled = !event.value;
});
// Atualiza as caixas numéricas do painel quando o usuário move o gizmo na tela
transformControls.addEventListener('change', () => {
    updateUIInputs();
});
scene.add(transformControls);

// --- ESTADO ---
let characterGroup = null;
let skeletonHelper = null;
let bonePickers = [];
let selectedBone = null;
let boneMap = new Map();
let initialPositionsMap = new Map();

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// --- CARREGADOR FBX ---
document.getElementById('file-input').addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.readAsArrayBuffer(file);
    reader.onload = (e) => {
        const loader = new FBXLoader();
        const fbx = loader.parse(e.target.result, '');

        clearCurrentModel();

        characterGroup = fbx;
        scene.add(characterGroup);

        characterGroup.scale.setScalar(1);

        // Helper de Esqueleto
        skeletonHelper = new THREE.SkeletonHelper(characterGroup);
        skeletonHelper.material.linewidth = 2;
        scene.add(skeletonHelper);

        characterGroup.traverse((child) => {
            if (child.isMesh) {
                child.material.side = THREE.DoubleSide;
                child.material.transparent = true;
                child.material.opacity = parseFloat(document.getElementById('opacity-slider').value);
            }

            if (child.isBone) {
                child.matrixAutoUpdate = true;

                // Guarda a posição inicial padrão do osso
                initialPositionsMap.set(child, {
                    position: child.position.clone(),
                    rotation: child.rotation.clone()
                });

                // Esfera seletora para cada osso
                const pickerGeo = new THREE.SphereGeometry(1.8, 16, 16);
                const pickerMat = new THREE.MeshBasicMaterial({ 
                    color: 0xffcc00, 
                    depthTest: false,
                    transparent: true,
                    opacity: 0.8 
                });
                const picker = new THREE.Mesh(pickerGeo, pickerMat);
                picker.renderOrder = 999;
                
                scene.add(picker);
                bonePickers.push(picker);
                boneMap.set(picker, child);
            }
        });

        updateVisibility();
    };
});

function clearCurrentModel() {
    if (characterGroup) scene.remove(characterGroup);
    if (skeletonHelper) scene.remove(skeletonHelper);
    bonePickers.forEach(p => scene.remove(p));
    bonePickers = [];
    boneMap.clear();
    initialPositionsMap.clear();
    transformControls.detach();
    selectedBone = null;
    document.getElementById('bone-panel').style.display = 'none';
}

function updateHelpers() {
    bonePickers.forEach(picker => {
        const bone = boneMap.get(picker);
        if (bone) {
            bone.getWorldPosition(picker.position);
            picker.material.color.setHex(bone === selectedBone ? 0x00ff00 : 0xffcc00);
        }
    });
}

// SELEÇÃO DO OSSO
function selectBone(bone) {
    selectedBone = bone;
    transformControls.attach(bone);
    
    // Exibe o painel de edição
    document.getElementById('bone-panel').style.display = 'flex';
    document.getElementById('selected-bone-name').innerText = bone.name || 'Osso Selecionado';
    
    updateUIInputs();
}

// Sincroniza a posição e rotação do osso selecionado com os campos numéricos do painel
function updateUIInputs() {
    if (!selectedBone) return;

    // Posição X, Y, Z
    document.getElementById('pos-x').value = selectedBone.position.x.toFixed(2);
    document.getElementById('pos-y').value = selectedBone.position.y.toFixed(2);
    document.getElementById('pos-z').value = selectedBone.position.z.toFixed(2);

    // Rotação X, Y, Z em graus
    document.getElementById('rot-x').value = THREE.MathUtils.radToDeg(selectedBone.rotation.x).toFixed(0);
    document.getElementById('rot-y').value = THREE.MathUtils.radToDeg(selectedBone.rotation.y).toFixed(0);
    document.getElementById('rot-z').value = THREE.MathUtils.radToDeg(selectedBone.rotation.z).toFixed(0);
}

// EVENTOS DE ALTERAÇÃO DIRETA NOS INPUTS DE POSIÇÃO (X, Y, Z)
['pos-x', 'pos-y', 'pos-z'].forEach((id, index) => {
    document.getElementById(id).addEventListener('input', (e) => {
        if (!selectedBone) return;
        const value = parseFloat(e.target.value) || 0;
        const axis = ['x', 'y', 'z'][index];
        selectedBone.position[axis] = value;
    });
});

// EVENTOS DE ALTERAÇÃO DIRETA NOS INPUTS DE ROTAÇÃO (X, Y, Z)
['rot-x', 'rot-y', 'rot-z'].forEach((id, index) => {
    document.getElementById(id).addEventListener('input', (e) => {
        if (!selectedBone) return;
        const valueDegrees = parseFloat(e.target.value) || 0;
        const axis = ['x', 'y', 'z'][index];
        selectedBone.rotation[axis] = THREE.MathUtils.degToRad(valueDegrees);
    });
});

// RESETAR APENAS O OSSO SELECIONADO
document.getElementById('btn-reset-selected').addEventListener('click', () => {
    if (!selectedBone) return;
    const initial = initialPositionsMap.get(selectedBone);
    if (initial) {
        selectedBone.position.copy(initial.position);
        selectedBone.rotation.copy(initial.rotation);
        updateUIInputs();
    }
});

// ALTERAR MODO DO GIZMO
const setMode = (mode, btnId) => {
    transformControls.setMode(mode);
    ['btn-mode-translate', 'btn-mode-rotate', 'btn-mode-scale'].forEach(id => {
        document.getElementById(id).classList.toggle('active', id === btnId);
    });
};

document.getElementById('btn-mode-translate').addEventListener('click', () => setMode('translate', 'btn-mode-translate'));
document.getElementById('btn-mode-rotate').addEventListener('click', () => setMode('rotate', 'btn-mode-rotate'));
document.getElementById('btn-mode-scale').addEventListener('click', () => setMode('scale', 'btn-mode-scale'));

// CONTROLE DE VISIBILIDADE
function updateVisibility() {
    const showSkeleton = document.getElementById('chk-skeleton').checked;
    const showPickers = document.getElementById('chk-pickers').checked;

    if (skeletonHelper) skeletonHelper.visible = showSkeleton;
    bonePickers.forEach(p => p.visible = showPickers);
}

document.getElementById('chk-skeleton').addEventListener('change', updateVisibility);
document.getElementById('chk-pickers').addEventListener('change', updateVisibility);

document.getElementById('opacity-slider').addEventListener('input', (e) => {
    const opacity = parseFloat(e.target.value);
    if (characterGroup) {
        characterGroup.traverse((child) => {
            if (child.isMesh) child.material.opacity = opacity;
        });
    }
});

// CLIQUE PARA SELECIONAR OSSO NA CENA
window.addEventListener('pointerdown', (event) => {
    if (event.target.tagName === 'INPUT' || event.target.tagName === 'BUTTON' || event.target.tagName === 'LABEL') return;

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const visiblePickers = bonePickers.filter(p => p.visible);
    const intersects = raycaster.intersectObjects(visiblePickers);

    if (intersects.length > 0) {
        const pickedObject = intersects[0].object;
        const targetBone = boneMap.get(pickedObject);
        if (targetBone) {
            selectBone(targetBone);
        }
    }
});

// LOOP DE RENDERIZAÇÃO
function animate() {
    requestAnimationFrame(animate);
    updateHelpers();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
